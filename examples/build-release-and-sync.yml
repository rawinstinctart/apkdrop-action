name: Android Release + APKDrop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APK_PATH: app/build/outputs/apk/release/app-release.apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$APK_PATH" --generate-notes

      - name: Sync APKDrop
        id: apkdrop
        uses: rawinstinctart/apkdrop-action@v1
        with:
          release-tag: ${{ github.ref_name }}

      - name: Show APKDrop result
        run: |
          echo "Page: ${{ steps.apkdrop.outputs.showcase-url }}"
          echo "APK:  ${{ steps.apkdrop.outputs.download-url }}"
          echo "Receipt: ${{ steps.apkdrop.outputs.receipt-url }}"
